<div class="pj-film pj-f-rs" data-film data-dur="10" aria-hidden="true">
  <div class="rs-side">
    <p class="rs-count" data-text-at="0:1 / 17|3.4:2 / 17|6.8:3 / 17">1 / 17</p>
    <p class="rs-small">playable posts</p>
  </div>
  <div class="rs-phone">
    <div class="rs-feed" data-class-at="0:is-g1|3.4:is-g2|6.8:is-g3">
      <div class="rs-post rs-post--hop">
        <p class="rs-score">12</p>
        <i class="rs-ball"></i>
        <i class="rs-block"></i>
        <i class="rs-block rs-block--late"></i>
        <i class="rs-ground"></i>
        <div class="rs-meta"><b>hop</b><span>@reel_share · tap to jump</span></div>
      </div>
      <div class="rs-post rs-post--stack">
        <p class="rs-score">4</p>
        <i class="rs-slab rs-slab--move"></i>
        <i class="rs-slab" style="--n: 3"></i>
        <i class="rs-slab" style="--n: 2"></i>
        <i class="rs-slab" style="--n: 1"></i>
        <i class="rs-slab" style="--n: 0"></i>
        <div class="rs-meta"><b>stack</b><span>@reel_share · tap to drop</span></div>
      </div>
      <div class="rs-post rs-post--orbit">
        <p class="rs-score">x3</p>
        <i class="rs-ring"></i>
        <i class="rs-planet"></i>
        <i class="rs-moon"></i>
        <i class="rs-star" style="--x: 18%; --y: 22%"></i>
        <i class="rs-star" style="--x: 78%; --y: 30%"></i>
        <i class="rs-star" style="--x: 26%; --y: 62%"></i>
        <div class="rs-meta"><b>orbit</b><span>@reel_share · tap to flip</span></div>
      </div>
    </div>
    <div class="rs-rail"><i>♥</i><i>↗</i><i>⋯</i></div>
    <i class="rs-finger" data-at="2.7" data-until="3.5"></i>
    <i class="rs-finger" data-at="6.1" data-until="6.9"></i>
  </div>
  <div class="rs-side rs-side--r">
    <p class="rs-hand">swipe up,<br>next game</p>
  </div>
</div>
